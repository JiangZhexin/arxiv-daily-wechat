name: arxiv-daily-wechat

# 触发方式：
#   schedule  -> 每天自动运行；触发后先「等到北京时间 12:25」再抓取推送（见 wait_until.py）。
#                ⚠️ GitHub Actions 的 schedule 不保证准时：实测本仓库会比设定时间晚 2~5 小时触发。
#                   所以 cron 故意设在目标时刻之前，由任务自己等到点再干活 —— 这样无论
#                   GitHub 延迟多久，推送都落在同一时刻（默认北京时间 12:25）。
#                ① UTC 01:15 = 北京 09:15（主推：延迟后约 11:00~12:22 触发 → 等到 12:25 推送）
#                ② UTC 03:00 = 北京 11:00（兜底：主推整个没跑起来时，这次会在午后补推）
#                两次之间有去重机制，不会重复推送同一批论文。
#   workflow_dispatch -> 在 Actions 页面手动「Run workflow」；可勾选 dry_run 只预览不推送
on:
  schedule:
    - cron: "15 1 * * *"
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只预览不推送（验证配置用，勾选后不会发微信）"
        type: boolean
        default: false

# Pages 部署需要的权限
permissions:
  contents: write   # 需要写权限：把每日生成的页面提交回仓库，保留历史
  pages: write
  id-token: write

# 同一时间只允许一个部署在跑
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  daily-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 等到北京时间 12:25（抵消 GitHub schedule 的延迟，保证准点收到）
        if: github.event_name == 'schedule'
        env:
          # 可选：想改推送时刻就在 Variables 里建一个 PUSH_AT，值形如 12:25（北京时间）
          PUSH_AT: ${{ vars.PUSH_AT }}
        run: python tools/wait_until.py "${PUSH_AT:-12:25}"

      - name: 抓取 arXiv + 生成推文页面 + 推送微信
        env:
          # ---------- Secrets（在仓库 Settings → Secrets and variables → Actions → Secrets 中配置）----------
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}   # 推荐：PushPlus token（配了就走 PushPlus 通道）
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}     # 备选：微信测试号（不配 PushPlus 时使用）
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          WECHAT_TEMPLATE_ID: ${{ secrets.WECHAT_TEMPLATE_ID }}
          WECHAT_OPENID: ${{ secrets.WECHAT_OPENID }}
          # ---------- Variables ----------
          ARXIV_CATEGORIES: ${{ vars.ARXIV_CATEGORIES }}
          ARXIV_HOURS_BACK: ${{ vars.ARXIV_HOURS_BACK }}
          ARXIV_MAX_PAPERS: ${{ vars.ARXIV_MAX_PAPERS }}   # 详细模式单次最多推送篇数，默认 200
          WECHAT_MODE: ${{ vars.WECHAT_MODE }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          # ---------- 关注筛选（Variables，全部留空=不筛选，行为与以前完全一致）----------
          FILTER_KEYWORDS: ${{ vars.FILTER_KEYWORDS }}                     # 关注关键词，逗号分隔，如 "Calabi-Yau,Ricci flow"
          FILTER_AUTHORS: ${{ vars.FILTER_AUTHORS }}                       # 关注作者，逗号分隔，如 "Shing-Tung Yau"（姓/名顺序随意）
          FILTER_AUTHOR_CATEGORIES: ${{ vars.FILTER_AUTHOR_CATEGORIES }}   # 作者条件只在哪些分区生效，如 "math.DG,math.MG"（留空=全部分区）
          FILTER_SCOPE: ${{ vars.FILTER_SCOPE }}                           # 关键词匹配范围: title / title_abstract（默认）/ all
          FILTER_LOGIC: ${{ vars.FILTER_LOGIC }}                           # 关键词与作者的关系: or（默认）/ and
          # GitHub Pages 推文页的根 URL（仓库名固定为 arxiv-daily-wechat）
          # 第一次部署后可以从 Actions 日志 / Pages 页面看到完整 URL
          PAGE_BASE_URL: https://jiangzhexin.github.io/arxiv-daily-wechat
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "🧪 dry-run：只预览消息内容，不发送微信"
            python main.py --dry-run
          else
            python main.py
          fi

      - name: 把生成的页面和推送记录提交回仓库（保留历史 + 去重状态）
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@users.noreply.github.com"
          git add -f pages/ last_pushed.json
          if git diff --cached --quiet; then
            echo "页面无变化，跳过提交"
          else
            git commit -m "chore: 更新每日 arXiv 速览页面 $(date -u +%Y-%m-%d)"
            git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/JiangZhexin/arxiv-daily-wechat.git" HEAD:main
            echo "✅ 页面已提交回仓库"
          fi

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传 Pages 工件
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages/

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 部署完成日志
        run: |
          echo "✅ 推文页面已部署"
          echo "📌 访问地址: ${{ steps.deployment.outputs.page_url }}"
          echo "📌 今日页面: ${{ steps.deployment.outputs.page_url }}daily-$(date -u +%Y-%m-%d).html"